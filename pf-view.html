<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NTN Stake Token Portfolio View (WIP)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="common/style.css">
  <script src="common/common.js"></script>
</head>
<body>
  <div id="topBlock">
    <h1 id="pageTitle">Portfolio View (WIP)</h1>
    <!-- Warning banner is injected from common/disclaimer.html -->
    <div id="setupMount"></div>
    <script>
      // Inject shared disclaimer banner + popup
      try { if (typeof loadCommonDisclaimer === 'function') loadCommonDisclaimer({ basePath: '', topBlockId: 'topBlock', setupMountId: 'setupMount' }); } catch {}
      // Inject shared title controls (currency, FX, decimals, ton toggle)
      try { if (typeof loadTitleControls === 'function') loadTitleControls({ basePath: '' }); } catch {}
    </script>
  </div>
  <div id="topSpacer"></div>
  <script>
    window.__setupReady = (typeof loadCommonSetup === 'function') ? loadCommonSetup({ basePath: '', mountId: 'setupMount' }) : Promise.resolve();
  </script>
  <div class="wip-note">
    This view will consolidate your global portfolio across Locking Contracts and Delegator accounts. For now, only the shared Setup is available here. Use <a href="lci/lc-dashboard.html">LC Dashboard</a> for full functionality.
  </div>
</body>
</html>
